<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sammenligne brøker – Fruktfatet</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <canvas id="confetti-canvas" class="confetti-canvas" aria-hidden="true"></canvas>

  <div class="page-shell">
    <header class="top-header">
      <div class="brand-block">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="42" height="42" role="img" focusable="false">
            <circle cx="24" cy="24" r="22" fill="#FEF08A" stroke="#F59E0B" stroke-width="3" />
            <path d="M13 27 C16 35, 32 35, 35 27 Z" fill="#92400E" />
            <circle cx="19" cy="22" r="5" fill="#EF4444" />
            <circle cx="28" cy="22" r="5" fill="#FB923C" />
            <path d="M18 16 C22 12, 30 14, 32 20" fill="none" stroke="#EAB308" stroke-width="4" stroke-linecap="round" />
          </svg>
        </div>
        <div>
          <h1 class="site-title">Brøkdetektiven: Fruktfatet</h1>
          <p class="site-subtitle">Lær å sammenligne brøker ved å finne fellesnevner!</p>
        </div>
      </div>

      <div class="progress-badge" id="tasks-completed-badge" aria-live="polite">
        0 av 4 oppgaver løst
      </div>
    </header>

    <nav class="task-tabs" id="task-tabs" aria-label="Velg oppgave"></nav>

    <section class="statement-card" aria-labelledby="statement-label">
      <div class="statement-header-row">
        <span class="statement-tag" id="statement-label">Påstand vi skal undersøke</span>
        <span class="guess-pill hidden" id="guess-summary-pill" aria-live="polite"></span>
      </div>
      <div class="statement-content">
        <blockquote class="statement-quote" id="statement-text"></blockquote>
        <span class="statement-question">Sant eller usant?</span>
      </div>
    </section>

    <ol class="step-stepper" id="step-stepper" aria-label="Steg i utregningen"></ol>

    <section class="guide-card" aria-live="polite">
      <div class="guide-avatar" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="54" height="54" focusable="false">
          <circle cx="32" cy="32" r="30" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3" />
          <circle cx="23" cy="28" r="6" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2.5" />
          <circle cx="41" cy="28" r="6" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2.5" />
          <circle cx="24" cy="28" r="2.8" fill="#1E3A8A" />
          <circle cx="40" cy="28" r="2.8" fill="#1E3A8A" />
          <line x1="29" y1="28" x2="35" y2="28" stroke="#1E3A8A" stroke-width="2.5" />
          <path d="M23 42 Q32 49 41 42" fill="none" stroke="#1E3A8A" stroke-width="3" stroke-linecap="round" />
        </svg>
      </div>
      <div class="guide-body">
        <h2 class="guide-title" id="guide-title"></h2>
        <p class="guide-text" id="guide-text"></p>
        <div class="feedback-banner hidden" id="feedback-banner" role="status" aria-live="polite"></div>
      </div>
    </section>

    <main class="workspace-grid" id="workspace-grid">
      <section class="panel-card fruit-panel" id="fruit-panel" aria-labelledby="fruit-panel-heading">
        <div class="panel-header">
          <h3 class="panel-title" id="fruit-panel-heading">Fruktfatet</h3>
          <span class="counter-pill" id="fruit-counter-pill">10 frukter på fatet</span>
        </div>

        <div class="fruit-bowl-stage" id="fruit-bowl-container"></div>

        <div class="fruit-legend" id="fruit-legend" aria-label="Oversikt over frukter"></div>

        <div class="fruit-actions" id="fruit-actions"></div>
      </section>

      <section class="panel-card math-panel" id="math-panel" aria-labelledby="math-panel-heading">
        <div class="panel-header">
          <h3 class="panel-title" id="math-panel-heading">Utregning og brøkstaver</h3>
          <button type="button" class="btn btn-subtle hidden" id="btn-replay-anim">
            ↻ Spill animasjon på nytt
          </button>
        </div>

        <div class="math-stage" id="math-stage-container"></div>
      </section>
    </main>

    <footer class="bottom-nav" aria-label="Stegnavigasjon">
      <div class="nav-left">
        <button type="button" class="btn btn-secondary" id="btn-prev">
          ← Forrige steg
        </button>
        <button type="button" class="btn btn-ghost" id="btn-reset">
          Start oppgaven på nytt
        </button>
      </div>
      <div class="nav-right">
        <span class="nav-hint" id="nav-hint"></span>
        <button type="button" class="btn btn-primary" id="btn-next">
          Neste steg →
        </button>
      </div>
    </footer>
  </div>

  <script src="js/tasks.js" defer></script>
  <script src="js/fruit-bowl.js" defer></script>
  <script src="js/fraction-animator.js" defer></script>
  <script src="js/confetti.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
